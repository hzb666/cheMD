# Trellis Configuration
# Project-level settings for the Trellis workflow system
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks
#-------------------------------------------------------------------------------

# Shell commands to run after task lifecycle events.
# Each hook receives TASK_JSON_PATH environment variable pointing to task.json.
# Hook failures print a warning but do not block the main operation.
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Declare packages for monorepo projects.
# Trellis auto-detects workspaces during `trellis init`, but you can also
# configure them manually here.
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule

# Default package used when --package is not specified.
# default_package: frontend

# Auto-detected monorepo packages
packages:
  web:
    path: apps/web
  compiler:
    path: packages/compiler
  core:
    path: packages/core
  cli:
    path: packages/cli
  diagnostics:
    path: packages/diagnostics
  exporter-training:
    path: packages/exporter-training
  lnf:
    path: packages/lnf
  parser:
    path: packages/parser
  render-profile:
    path: packages/render-profile
  renderer-docx:
    path: packages/renderer-docx
  renderer-html:
    path: packages/renderer-html
  renderer-json:
    path: packages/renderer-json
  resolver:
    path: packages/resolver
  runtime-lab:
    path: packages/runtime-lab
  runtime-trace:
    path: packages/runtime-trace
  step-ontology:
    path: packages/step-ontology
  storage-postgres:
    path: packages/storage-postgres
  typechecker:
    path: packages/typechecker
default_package: web
