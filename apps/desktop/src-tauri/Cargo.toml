[package]
name = "chemd-desktop"
version = "0.1.0"
description = "Chemd Desktop IDE"
authors = ["Chemd contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chemd_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "chemd-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
native-tls = "0.2"
postgres = "0.19"
postgres-native-tls = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.6.1", features = [] }
url = "2"
