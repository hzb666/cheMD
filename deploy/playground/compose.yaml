services:
  web:
    build:
      context: ../..
      dockerfile: deploy/playground/web.Dockerfile
    depends_on:
      - chem-service
    environment:
      NODE_ENV: production
      CHEM_SERVICE_BASE_URL: http://chem-service:18081
      CHEM_SERVICE_ACCESS_KEY: ${CHEM_SERVICE_ACCESS_KEY:?Set CHEM_SERVICE_ACCESS_KEY in deploy/playground/.env}
      PANDOC_PATH: ${PANDOC_PATH}
      LAB_STORAGE_BASE_URL: ${LAB_STORAGE_BASE_URL}
      LAB_STORAGE_USERNAME: ${LAB_STORAGE_USERNAME}
      LAB_STORAGE_PASSWORD: ${LAB_STORAGE_PASSWORD}
      LAB_STORAGE_DEVICE_ID: ${LAB_STORAGE_DEVICE_ID}
      LAB_STORAGE_DEVICE_NAME: ${LAB_STORAGE_DEVICE_NAME}
    ports:
      - "127.0.0.1:${PUBLIC_WEB_PORT:-2436}:2436"
    restart: unless-stopped

  chem-service:
    build:
      context: ../..
      dockerfile: deploy/playground/chem-service.Dockerfile
    environment:
      CHEM_SERVICE_HOST: 0.0.0.0
      CHEM_SERVICE_PORT: 18081
      CHEM_SERVICE_INTERNAL_ONLY: "false"
      CHEM_SERVICE_ACCESS_KEY: ${CHEM_SERVICE_ACCESS_KEY:?Set CHEM_SERVICE_ACCESS_KEY in deploy/playground/.env}
      CHEM_SERVICE_ALLOW_ORIGINS: ${CHEM_SERVICE_ALLOW_ORIGINS:-http://localhost}
      CHEM_SERVICE_MOLECULE_OCR_PROVIDER: ${CHEM_SERVICE_MOLECULE_OCR_PROVIDER:-placeholder}
      CHEM_SERVICE_REACTION_OCR_PROVIDER: ${CHEM_SERVICE_REACTION_OCR_PROVIDER:-placeholder}
      CHEM_SERVICE_MAX_CONTENT_LENGTH: 7252652
      CHEM_SERVICE_MAX_IMAGE_BASE64_LENGTH: 6990508
      CHEM_SERVICE_CACHE_MAX_ENTRIES: 256
      CHEM_SERVICE_RXNSCRIBE_API_URL: ${CHEM_SERVICE_RXNSCRIBE_API_URL}
      CHEM_SERVICE_RXNSCRIBE_TIMEOUT_SECONDS: ${CHEM_SERVICE_RXNSCRIBE_TIMEOUT_SECONDS:-60}
      CHEM_SERVICE_RXNSCRIBE_API_KEY: ${CHEM_SERVICE_RXNSCRIBE_API_KEY}
      CHEM_SERVICE_DECIMER_API_URL: ${CHEM_SERVICE_DECIMER_API_URL}
      CHEM_SERVICE_DECIMER_TIMEOUT_SECONDS: ${CHEM_SERVICE_DECIMER_TIMEOUT_SECONDS:-60}
      CHEM_SERVICE_DECIMER_API_KEY: ${CHEM_SERVICE_DECIMER_API_KEY}
      CHEM_SERVICE_MOLSCRIBE_API_URL: ${CHEM_SERVICE_MOLSCRIBE_API_URL}
      CHEM_SERVICE_MOLSCRIBE_TIMEOUT_SECONDS: ${CHEM_SERVICE_MOLSCRIBE_TIMEOUT_SECONDS:-60}
      CHEM_SERVICE_MOLSCRIBE_API_KEY: ${CHEM_SERVICE_MOLSCRIBE_API_KEY}
      CHEM_SERVICE_MOLNEXTR_API_URL: ${CHEM_SERVICE_MOLNEXTR_API_URL}
      CHEM_SERVICE_MOLNEXTR_TIMEOUT_SECONDS: ${CHEM_SERVICE_MOLNEXTR_TIMEOUT_SECONDS:-60}
      CHEM_SERVICE_MOLNEXTR_API_KEY: ${CHEM_SERVICE_MOLNEXTR_API_KEY}
    restart: unless-stopped
